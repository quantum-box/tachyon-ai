# Builds the iOS and the Mac app and uploads both to TestFlight.
# Runs on every push to main that touches the app, on v* tags, and by hand.
#
# Needs, once (see apps/tachyon/README.md):
# - An app record for bundle ID `com.quantumbox.tachyonai` in App Store Connect,
#   with both the iOS and the macOS platform added (one app, universal purchase).
# - Repository variable `APPLE_TEAM_ID`: the Apple Developer team ID.
# - Repository secrets `APP_STORE_CONNECT_KEY_ID`, `APP_STORE_CONNECT_ISSUER_ID`
#   and `APP_STORE_CONNECT_PRIVATE_KEY` (the contents of the .p8 file): an App
#   Store Connect API key with the App Manager role or higher.
#
# No signing certificate is stored. The archive is built unsigned (the Mac one
# signed ad hoc, so that it carries the App Sandbox entitlements), and the
# export step signs it with a distribution certificate that Xcode manages in
# the cloud, authenticated by the API key.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/tachyon/**"
      - ".github/workflows/testflight.yml"
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: TachyonAI
            signing: CODE_SIGNING_ALLOWED=NO
          - platform: macOS
            scheme: TachyonAIMac
            # Signed ad hoc so the archive keeps its entitlements (App Sandbox is
            # required on the Mac App Store); the export re-signs it for distribution.
            signing: CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
    # Xcode 26 or later is needed for Liquid Glass.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/tachyon
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # TestFlight needs a new build number for every upload.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (see apps/tachyon/README.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild archive \
            -project TachyonAI.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -configuration Release \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -archivePath "$RUNNER_TEMP/TachyonAI.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${{ matrix.signing }}

      - name: Sign and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Only the key file is private. A umask for the whole step would also make
          # the exported Mac installer root-only, which App Store Connect rejects.
          (umask 077; printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8")
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" Config/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TachyonAI.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
